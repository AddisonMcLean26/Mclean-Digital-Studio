<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Thank you for contacting McLean Digital Studio."
    >

    <title>Thank You | McLean Digital Studio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: #f7f5f0;
            color: #18171a;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            position: relative;
            overflow: hidden;
        }

        .background-shape {
            position: absolute;

            width: 600px;
            height: 350px;

            border: 2px solid rgba(169, 139, 195, 0.25);

            border-radius:
                47% 53% 62% 38%
                / 41% 44% 56% 59%;

            top: -180px;
            right: -250px;

            transform: rotate(-18deg);
        }

        .background-shape::before,
        .background-shape::after {
            content: "";

            position: absolute;

            border: 2px solid rgba(169, 139, 195, 0.16);

            border-radius:
                52% 48% 39% 61%
                / 55% 39% 61% 45%;
        }

        .background-shape::before {
            inset: 45px;
        }

        .background-shape::after {
            inset: 95px;
        }

        .thank-you-card {
            width: 100%;
            max-width: 720px;

            padding: 70px 55px;

            background: #ffffff;

            border: 1px solid #ded9e1;
            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 30px 80px rgba(30, 25, 35, 0.1);

            position: relative;
            z-index: 2;
        }

        .eyebrow {
            margin-bottom: 18px;

            color: #745889;

            font-size: 0.72rem;
            font-weight: 800;

            letter-spacing: 2.5px;
        }

        h1 {
            margin-bottom: 24px;

            font-size: clamp(2.8rem, 7vw, 5rem);

            line-height: 0.98;
            letter-spacing: -3px;
        }

        h1 span {
            color: #745889;
        }

        .message {
            max-width: 540px;

            margin: 0 auto;

            color: #69666e;

            font-size: 1.05rem;
            line-height: 1.7;
        }

        .divider {
            width: 65px;
            height: 3px;

            margin: 32px auto;

            background: #a98bc3;
        }

        .return-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-top: 10px;

            padding: 14px 26px;

            background: #18171a;
            color: #ffffff;

            border-radius: 100px;

            text-decoration: none;

            font-size: 0.9rem;
            font-weight: 750;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .return-button:hover {
            background: #745889;
            transform: translateY(-2px);
        }

        .studio-name {
            margin-top: 40px;

            color: #69666e;

            font-size: 0.75rem;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .thank-you-card {
                padding: 55px 25px;
            }

            h1 {
                letter-spacing: -2px;
            }
        }
    </style>
</head>


<body>

    <div
        class="background-shape"
        aria-hidden="true"
    ></div>


    <main class="thank-you-card">

        <p class="eyebrow">
            INQUIRY RECEIVED
        </p>

        <h1>
            Thank you for
            <span>reaching out.</span>
        </h1>

        <div class="divider"></div>

        <p class="message">
            Your project inquiry has been sent successfully.
            I'll review what you shared and get back to you soon.
            I'm looking forward to learning more about your business.
        </p>

        <a
            href="/"
            class="return-button"
        >
            Back to McLean Digital Studio →
        </a>

        <p class="studio-name">
            McLean Digital Studio
        </p>

    </main>

</body>

</html>
